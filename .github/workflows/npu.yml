name: NPU

# Could Recite's recogniser run on the owner's phone's NPU (Snapdragon 7 Gen 4's Hexagon, through
# Qualcomm's QNN)? Exports Tarteel's tiny encoder to ONNX (tools/npu/export.py: checked against
# PyTorch, timed on this CPU), then tries Qualcomm's AI Runtime SDK (QAIRT, public download) to
# convert it and compile it ahead of time for the Hexagon versions a Snapdragon may have (v73,
# v75, v79): whether that works here, and the sizes. No phone involved yet.
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/npu.yml'
      - 'tools/npu/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Export the encoder to ONNX
        run: |
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          pip install --quiet "transformers<5" onnx onnxruntime numpy
          python3 tools/npu/export.py out
      - name: Qualcomm AI Runtime SDK
        continue-on-error: true
        run: |
          V=2.42.0.251225
          curl -sSfL -o qairt.zip "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/$V/v$V.zip" || { echo "QAIRT download refused"; exit 1; }
          ls -la qairt.zip
          unzip -q qairt.zip -d qairt
          root=$(ls -d qairt/qairt/* | head -1); echo "SDK at $root"
          echo "QNN_SDK_ROOT=$PWD/$root" >> $GITHUB_ENV
          ls $root/lib/hexagon-* -d 2>/dev/null; ls $root/bin/x86_64-linux-clang | head -40
      - name: Convert and compile for the Hexagon NPU
        continue-on-error: true
        run: |
          export PYTHONPATH=$QNN_SDK_ROOT/lib/python:$PYTHONPATH
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          B=$QNN_SDK_ROOT/bin/x86_64-linux-clang
          # The converter's own Python dependencies (its check script, else the usual pins).
          if [ -x $QNN_SDK_ROOT/bin/check-python-dependency ]; then yes | python3 $QNN_SDK_ROOT/bin/check-python-dependency 2>&1 | tail -15; fi
          python3 -m pip install --quiet "onnx==1.16.1" "numpy<2" "protobuf<5" pyyaml pandas packaging 2>&1 | tail -3
          python3 -c "import onnx, numpy; print('onnx', onnx.__version__, 'numpy', numpy.__version__)"
          # Float model, run in half precision on the NPU (no calibration needed).
          python3 $B/qnn-onnx-converter --input_network out/encoder.onnx --output_path out/qnn/encoder.cpp --float_bitwidth 16 2>&1 | tail -30
          ls -la out/qnn || exit 1
          $B/qnn-model-lib-generator -c out/qnn/encoder.cpp -b out/qnn/encoder.bin -o out/qnn/lib -t x86_64-linux-clang 2>&1 | tail -5
          ls -laR out/qnn/lib | head
          for v in 73 75 79; do
            printf '{"graphs":[{"graph_names":["encoder"],"vtcm_mb":0}],"devices":[{"htp_arch":"v%s"}]}\n' $v > htp_v$v.json
            printf '{"backend_extensions":{"shared_library_path":"%s","config_file_path":"htp_v%s.json"}}\n' "$QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtpNetRunExtensions.so" $v > ext_v$v.json
            $B/qnn-context-binary-generator --backend $QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so \
              --model out/qnn/lib/x86_64-linux-clang/libencoder.so --binary_file encoder_v$v \
              --output_dir out/ctx --config_file ext_v$v.json 2>&1 | tail -5
          done
          ls -la out/ctx || true
          python3 $B/qnn-onnx-converter --help 2>&1 | grep -iE -A2 "float_bitwidth|bw|layout|io_|dtype|preserve" | head -60
      - name: The compiled encoder's inputs and outputs (names, ids, shapes, types)
        continue-on-error: true
        run: |
          B=$QNN_SDK_ROOT/bin/x86_64-linux-clang
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          $B/qnn-context-binary-utility --context_binary out/ctx/encoder_v73.bin --json_file out/ctx/info_v73.json 2>&1 | tail -3
          python3 - <<'PY'
          import json
          info = json.load(open("out/ctx/info_v73.json"))
          def walk(x, path=""):
              if isinstance(x, dict):
                  if "dimensions" in x or "dims" in x:
                      print({k: x.get(k) for k in ("id", "name", "type", "dataType", "dimensions", "dims", "dataFormat", "quantizeParams") if k in x})
                  for k, v in x.items(): walk(v, path + "/" + k)
              elif isinstance(x, list):
                  for v in x: walk(v, path)
          print(json.dumps({k: v for k, v in info.items() if not isinstance(v, (dict, list))}, indent=1)[:2000])
          walk(info)
          PY
      - name: The converted encoder on Qualcomm's HTP emulator (as v73) against ONNX Runtime
        continue-on-error: true
        timeout-minutes: 40
        run: |
          B=$QNN_SDK_ROOT/bin/x86_64-linux-clang
          L=$QNN_SDK_ROOT/lib/x86_64-linux-clang
          export LD_LIBRARY_PATH=$L:$LD_LIBRARY_PATH
          # The graph's input is frame by frame ([1, 3000, 80]: the converter's layout).
          echo "$PWD/out/mel_t.raw" > list.txt
          compare() {
            python3 - "$1" <<'PY'
          import glob, sys, numpy as np
          ref = np.fromfile("out/encoder_out.raw", dtype=np.float32)
          files = glob.glob(sys.argv[1] + "/**/*.raw", recursive=True)
          print("outputs:", files)
          for f in files:
              got = np.fromfile(f, dtype=np.float32)
              if got.size != ref.size:
                  print(f, "size", got.size, "expected", ref.size); continue
              same = np.abs(got - ref).max()
              t = got.reshape(384, 1500).T.reshape(-1) if got.size == 1500 * 384 else got
              print(f"{f}: max abs diff {same:.3e} (as is), {np.abs(t - ref).max():.3e} (transposed); scale {np.abs(ref).max():.2f}; cosine {float(got @ ref / np.linalg.norm(got) / np.linalg.norm(ref)):.6f}")
          PY
          }
          t=$(date +%s); $B/qnn-net-run --backend $L/libQnnHtp.so --model out/qnn/lib/x86_64-linux-clang/libencoder.so --input_list list.txt --output_dir out/run_htp --config_file ext_v73.json 2>&1 | tail -5; echo "HTP emulator: $(( $(date +%s) - t )) s"
          compare out/run_htp
      - name: The context binary for the phone (v73) in the speech-model pre-release
        if: github.ref_name == 'claude/hfd-quran-learning-app-n48y3d'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s out/ctx/encoder_v73.bin
          cp out/ctx/encoder_v73.bin encoder-tiny-ar-quran-qnn242-v73.bin
          sha256sum encoder-tiny-ar-quran-qnn242-v73.bin
          # Once: the app pins the published file's SHA-256 (NpuEncoder). A new one takes a new name.
          if gh release view speech-model --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx encoder-tiny-ar-quran-qnn242-v73.bin; then
            echo "already published"
          else
            gh release upload speech-model encoder-tiny-ar-quran-qnn242-v73.bin --repo "$GITHUB_REPOSITORY"
          fi
      - name: Which Hexagon the Snapdragon 7 Gen 4 (SM7750) has, by Qualcomm's SDK
        continue-on-error: true
        run: |
          grep -rIl -i "sm7750\|7 gen 4\|SM7750" $QNN_SDK_ROOT 2>/dev/null | head -10
          grep -rIh -i -B2 -A6 "sm7750" $QNN_SDK_ROOT 2>/dev/null | head -60
