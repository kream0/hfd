name: Screenshots

# Renders the main screens with Robolectric (no emulator), in French and in both themes, and
# commits them to docs/screenshots as the website's WebPs (tools/screenshots/normalise.py), so the
# UI can be checked from the dev sandbox. Runs on changes to the screenshot test, or by hand.
on:
  push:
    branches: ['**']
    paths:
      - 'app/src/testDebug/**'
      - 'tools/screenshots.trigger'
      - 'tools/screenshots/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-shots-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-shots-${{ runner.os }}-
            gradle-${{ runner.os }}-
      - name: Render
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'app.hfd.ScreenshotTest' 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Exception|Caused by" -A 6 build.log | head -150 || true
          find app/build/test-results -name '*.xml' -exec grep -h -A 30 '<failure' {} + | head -120 || true
      - name: WebP for the website
        if: always()
        run: |
          pip install --quiet pillow
          python3 tools/screenshots/normalise.py build/screenshots docs/screenshots
      - name: Commit screenshots
        if: always()
        run: |
          ls -la docs/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "Update screenshots"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
