name: Diagnostics

# Prints what the app sent to its diagnostics topic (app/.../diag/Diag.kt → ntfy.sh, kept 12 h),
# for reading with get_job_logs: the dev sandbox can't reach ntfy.sh. Touch .github/diag.trigger
# (e.g. write the time into it) and push to read the latest. Recordings (only when the owner
# switched them on) are downloaded, measured and transcribed here (the app's model, and a large
# general one to tell a sound problem from a model problem); whole Recite sessions are kept in the
# Actions cache for the Recite bench (recite.yml replays them through the app's pipeline).
on:
  push:
    branches: ['**']
    paths:
      - '.github/diag.trigger'
      - '.github/workflows/diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Diagnostics of the last 12 hours
        run: |
          mkdir -p rec
          curl -sS "https://ntfy.sh/hfd-diag-6641caac476110c0b784/json?poll=1&since=12h" | python3 -c '
          import json, sys, datetime, urllib.request
          for raw in sys.stdin:
              m = json.loads(raw)
              if m.get("event") != "message":
                  continue
              att = m.get("attachment")
              body = m.get("message", "")
              if att and not att["name"].endswith(".wav"):
                  # A batch of events over 4 KB (before 1.14.2) became an attachment.
                  try:
                      body = urllib.request.urlopen(att["url"]).read().decode("utf-8")
                  except Exception as e:
                      print("events", att["name"], "not available:", e)
                      continue
              elif att:
                  # ntfy keeps attachments ~3 h: older ones are gone (404).
                  try:
                      urllib.request.urlretrieve(att["url"], "rec/" + att["name"])
                      print("recording", att["name"], att.get("size"))
                  except Exception as e:
                      print("recording", att["name"], "not available:", e)
                  continue
              for line in body.splitlines():
                  try:
                      d = json.loads(line)
                  except ValueError:
                      print("?", line); continue
                  ms = d.pop("t")
                  t = datetime.datetime.fromtimestamp(ms / 1000, datetime.timezone.utc).strftime("%H:%M:%S") + f".{ms % 1000:03d}"
                  s, e = d.pop("s", "?"), d.pop("e", "?")
                  print(t, s, e, " ".join(f"{k}={v}" for k, v in d.items()))
          '
          # A recording over a minute comes in parts (<name>.part<i>of<n>.wav, Diag.attach): joined.
          python3 - <<'PY'
          import glob, re, os, struct
          groups = {}
          for path in glob.glob("rec/*.part*of*.wav"):
              m = re.match(r"(.*)\.part(\d+)of(\d+)\.wav$", path)
              groups.setdefault(m.group(1), []).append((int(m.group(2)), int(m.group(3)), path))
          for base, parts in groups.items():
              parts.sort()
              pcm = b""
              for _, _, path in parts:
                  raw = open(path, "rb").read()
                  pcm += raw[raw.find(b"data") + 8:]
                  os.remove(path)
              head = b"RIFF" + struct.pack("<I", 36 + len(pcm)) + b"WAVEfmt " + struct.pack("<IHHIIHH", 16, 1, 1, 16000, 32000, 2, 16) + b"data" + struct.pack("<I", len(pcm))
              open(base + ".wav", "wb").write(head + pcm)
              print("joined", base + ".wav", f"{len(parts)}/{parts[0][1]} parts", f"{len(pcm) / 32000:.1f} s")
          PY
          ls rec | head -50
      - name: The recordings' sound (level, and where the energy lies)
        run: |
          if [ -z "$(ls rec)" ]; then echo "No recordings"; exit 0; fi
          pip install --quiet numpy
          python3 - <<'PY'
          import glob, numpy as np
          for path in sorted(glob.glob("rec/*.wav")):
              raw = open(path, "rb").read()
              i = raw.find(b"data")
              x = np.frombuffer(raw[i + 8:], dtype="<i2").astype(np.float32) / 32768
              n = len(x) // 320
              e = np.sqrt(np.mean(x[:n * 320].reshape(n, 320) ** 2, axis=1) + 1e-12)
              s = np.abs(np.fft.rfft(x)) ** 2
              f = np.fft.rfftfreq(len(x), 1 / 16000)
              edges = [0, 120, 300, 1000, 2000, 4000, 8001]
              b = [s[(f >= a) & (f < c)].sum() for a, c in zip(edges, edges[1:])]
              bands = "/".join(f"{100 * v / sum(b):.1f}" for v in b)
              print(f"{path}: {len(x) / 16000:.1f} s, loud {20 * np.log10(np.percentile(e, 90)):.1f} dB, "
                    f"quiet {20 * np.log10(np.percentile(e, 10)):.1f} dB, bands 0-120/120-300/300-1k/1-2k/2-4k/4-8k Hz: {bands} %")
          PY
      - name: The owner's kept sessions, finely (third-octave levels of the voice, against a reference recitation)
        # A sharp drop at one frequency is a filter in the phone's audio path; a gentle slope is the
        # voice itself, or how it reaches the microphone (cloth, bone conduction in earbuds…).
        uses: actions/cache/restore@v5
        with:
          path: owner-rec
          key: owner-rec-none
          restore-keys: owner-rec-
      - uses: actions/checkout@v6
        with:
          sparse-checkout: app/src/main/assets/diag
          path: repo
      - run: |
          pip install --quiet numpy
          python3 - <<'PY'
          import glob, numpy as np
          def read(path):
              raw = open(path, "rb").read()
              i = raw.find(b"data")
              return np.frombuffer(raw[i + 8:], dtype="<i2").astype(np.float32) / 32768
          centres = [100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300]
          print("third-octave levels of the voiced frames, dB from the loudest band:")
          print(f"{'':44s}" + "".join(f"{c:>6d}" for c in centres))
          for path in ["repo/app/src/main/assets/diag/112001.wav"] + sorted(glob.glob("owner-rec/*.wav")) + sorted(glob.glob("rec/*.wav")):
              x = read(path)
              n = len(x) // 512
              if n < 4:
                  continue
              fr = x[:n * 512].reshape(n, 512) * np.hanning(512)
              e = np.sqrt(np.mean(fr ** 2, axis=1))
              voiced = fr[e >= np.percentile(e, 60)]
              p = (np.abs(np.fft.rfft(voiced, axis=1)) ** 2).mean(axis=0)
              f = np.fft.rfftfreq(512, 1 / 16000)
              lv = []
              for c in centres:
                  band = p[(f >= c / 2 ** (1 / 6)) & (f < c * 2 ** (1 / 6))]
                  lv.append(10 * np.log10(band.sum() + 1e-20))
              top = max(lv)
              print(f"{path.split('/')[-1][:44]:44s}" + "".join(f"{v - top:6.0f}" for v in lv))
          PY
      - name: Keep the owner's session recordings for the Recite bench (the Actions cache, not published)
        uses: actions/cache/restore@v5
        with:
          path: owner-rec
          key: owner-rec-${{ github.run_id }}
          restore-keys: owner-rec-
      - id: keep
        run: |
          mkdir -p owner-rec
          new=0
          for f in rec/*-session-*.wav; do
            [ -e "$f" ] || continue
            [ -e "owner-rec/$(basename "$f")" ] || { cp "$f" owner-rec/; new=1; }
          done
          ls -l owner-rec
          echo "new=$new" >> "$GITHUB_OUTPUT"
      - if: steps.keep.outputs.new == '1'
        uses: actions/cache/save@v5
        with:
          path: owner-rec
          key: owner-rec-${{ github.run_id }}
      - name: Transcribe the recordings on a PC (the app's model; and a large general one on sessions)
        run: |
          if [ -z "$(ls rec)" ]; then echo "No recordings"; exit 0; fi
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF >/dev/null
          cmake --build whisper.cpp/build -j"$(nproc)" --config Release --target whisper-cli >/dev/null
          curl -sSfL -o model.bin https://github.com/kream0/hfd/releases/download/speech-model/ggml-tiny-ar-quran-q8_0.bin
          for f in rec/*.wav; do
            whisper.cpp/build/bin/whisper-cli -m model.bin -l ar -nt -np -bs 1 -bo 1 -mc 0 -f "$f" 2>/dev/null | tr '\n' ' ' | sed "s|^|tiny-quran $f: |"; echo
          done
          if ls rec/*-session-*.wav >/dev/null 2>&1; then
            curl -sSfL -o large.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
            for f in rec/*-session-*.wav; do
              whisper.cpp/build/bin/whisper-cli -m large.bin -l ar -nt -np -t "$(nproc)" -f "$f" 2>/dev/null | tr '\n' ' ' | sed "s|^|large-v3-turbo $f: |"; echo
            done
          fi
