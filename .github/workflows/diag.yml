name: Diagnostics

# Prints what the app sent to its diagnostics topic (app/.../diag/Diag.kt → ntfy.sh, kept 12 h),
# for reading with get_job_logs: the dev sandbox can't reach ntfy.sh. Touch .github/diag.trigger
# (e.g. write the time into it) and push to read the latest. Recordings (only when the owner
# switched them on) are downloaded and transcribed here with the app's model, on a PC.
on:
  push:
    branches: ['**']
    paths:
      - '.github/diag.trigger'
      - '.github/workflows/diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Diagnostics of the last 12 hours
        run: |
          mkdir -p rec
          curl -sS "https://ntfy.sh/hfd-diag-6641caac476110c0b784/json?poll=1&since=12h" | python3 -c '
          import json, sys, datetime, urllib.request
          for raw in sys.stdin:
              m = json.loads(raw)
              if m.get("event") != "message":
                  continue
              att = m.get("attachment")
              if att:
                  urllib.request.urlretrieve(att["url"], "rec/" + att["name"])
                  print("recording", att["name"], att.get("size"))
                  continue
              for line in m.get("message", "").splitlines():
                  try:
                      d = json.loads(line)
                  except ValueError:
                      print("?", line); continue
                  t = datetime.datetime.fromtimestamp(d.pop("t") / 1000, datetime.timezone.utc).strftime("%H:%M:%S")
                  s, e = d.pop("s", "?"), d.pop("e", "?")
                  print(t, s, e, " ".join(f"{k}={v}" for k, v in d.items()))
          '
          ls rec | head -50
      - name: Transcribe the recordings on a PC (app's model and parameters)
        run: |
          if [ -z "$(ls rec)" ]; then echo "No recordings"; exit 0; fi
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF >/dev/null
          cmake --build whisper.cpp/build -j"$(nproc)" --config Release --target whisper-cli >/dev/null
          curl -sSfL -o model.bin https://github.com/kream0/hfd/releases/download/speech-model/ggml-tiny-ar-quran-q8_0.bin
          for f in rec/*.wav; do
            whisper.cpp/build/bin/whisper-cli -m model.bin -l ar -nt -np -bs 1 -bo 1 -mc 0 -f "$f" 2>/dev/null | tr '\n' ' ' | sed "s|^|$f: |"; echo
          done
