name: Faint speech

# Recognition of speech at the level the owner's phone records it, with and without the app's
# gain (tools/levels/faint.py). Read the table with get_job_logs.
on:
  push:
    branches: ['**']
    paths:
      - 'tools/levels/**'
      - '.github/workflows/levels.yml'

permissions:
  contents: read

jobs:
  faint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: ffmpeg, numpy, whisper.cpp and the app's model
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet numpy
          mkdir -p work && cd work
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF >/dev/null
          cmake --build whisper.cpp/build -j"$(nproc)" --config Release --target whisper-cli >/dev/null
          curl -sSfL -o ggml-tiny-ar-quran-q8_0.bin https://github.com/kream0/hfd/releases/download/speech-model/ggml-tiny-ar-quran-q8_0.bin
          # The app's decoding parameters, as a small program against the same library.
          gcc -O2 -o app_decode ../tools/levels/app_decode.c -Iwhisper.cpp/include -Iwhisper.cpp/ggml/include \
            whisper.cpp/build/src/libwhisper.so -Wl,-rpath,$PWD/whisper.cpp/build/src:$PWD/whisper.cpp/build/ggml/src
          ls whisper.cpp/build/src whisper.cpp/build/ggml/src | head -20
      - run: python3 tools/levels/faint.py
