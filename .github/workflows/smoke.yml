name: Smoke test

# The release APK on a real Android 16 (an emulator): installs, starts (timed), every main screen
# comes, a long sūra scrolls, nothing crashes and nothing the code needs was removed. Built both
# plain and with R8 (-Phfd.minify=true) and run on the same emulator, to compare them before R8
# becomes what is released. Read the "SMOKE" lines of the log; the screenshots are in the run's
# artifacts.
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/smoke.yml'
      - 'tools/smoke/**'
      - 'app/src/main/java/app/hfd/data/AppLocale.kt'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/app/hfd/recite/**'
      - 'app/proguard-rules.pro'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Above any release: the updater has nothing to offer the build under test.
      HFD_VERSION_NAME: 0.smoke
      HFD_VERSION_CODE: 999000000
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # As build.yml: QNN's headers for the NPU, fetched and never committed.
      - uses: actions/cache@v5
        id: qnn-headers
        with:
          path: qnn-include
          key: qnn-include-2.42.0.251225
      - name: QNN headers
        run: |
          if [ ! -f qnn-include/QnnInterface.h ]; then
            python3 -m pip install --quiet remotezip
            python3 tools/npu/headers.py 2.42.0.251225 qnn-include
          fi
          echo "QNN_INCLUDE=$PWD/qnn-include" >> "$GITHUB_ENV"

      - name: Release APKs, plain and with R8
        run: |
          set -o pipefail
          mkdir -p dist
          for kind in plain r8; do
            minify=false; if [ $kind = r8 ]; then minify=true; fi
            ./gradlew --no-daemon :app:assembleRelease -Phfd.minify=$minify 2>&1 | tee build-$kind.log | tail -15
            cp app/build/outputs/apk/release/app-release.apk dist/$kind.apk
            ls -l dist/$kind.apk
            unzip -l dist/$kind.apk | grep -E 'classes[0-9]*\.dex|baseline'
            # ONNX Runtime's Android library phones home from 1.29.0: none of that in the APK.
            if [ "$(unzip -p dist/$kind.apk 'lib/arm64-v8a/libonnxruntime.so' | strings -n 12 | grep -c OneCollector || true)" != 0 ]; then echo "::error::ONNX Runtime with telemetry in the APK"; exit 1; fi
            if [ "$(unzip -p dist/$kind.apk 'classes*.dex' | strings -n 12 | grep -c TelemetryInitializer || true)" != 0 ]; then echo "::error::ONNX Runtime's telemetry provider in the APK"; exit 1; fi
          done

      # The same, older than any release: its updater must find, fetch and check the latest one.
      - name: An old build with R8, for the updater
        env:
          HFD_VERSION_NAME: 0.old
          HFD_VERSION_CODE: 1
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease -Phfd.minify=true 2>&1 | tee build-old.log | tail -5
          cp app/build/outputs/apk/release/app-release.apk dist/r8-old.apk

      - name: Show build errors
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILED|Missing class|R8" build-*.log | head -80 || true

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Google's image: it runs arm64 code (the app's native libraries are arm64 only). Both
      # builds on the same emulator, then their starts once more each (runners differ too much
      # to compare two jobs).
      - name: The app on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            python3 tools/smoke/tour.py dist/plain.apk smoke-out plain; echo $? > smoke-out/plain.exit
            python3 tools/smoke/tour.py dist/r8.apk smoke-out r8; echo $? > smoke-out/r8.exit
            python3 tools/smoke/tour.py dist/plain.apk smoke-out plain starts
            python3 tools/smoke/tour.py dist/r8.apk smoke-out r8 starts
            python3 tools/smoke/tour.py dist/plain.apk smoke-out plain starts
            python3 tools/smoke/tour.py dist/r8.apk smoke-out r8 starts
            python3 tools/smoke/tour.py dist/r8-old.apk smoke-out r8-old update; echo $? > smoke-out/update.exit
            test "$(cat smoke-out/plain.exit)" = 0
            test "$(cat smoke-out/update.exit)" = 0
            test "$(cat smoke-out/r8.exit)" = 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke
          path: smoke-out
          retention-days: 7
