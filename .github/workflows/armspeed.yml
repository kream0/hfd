name: ARM speed

# How long a Recite reading takes on an ARM CPU (GitHub's arm64 runner, Neoverse N2: like the
# owner's Snapdragon 7 Gen 4, dot products, half floats and int8 matrix multiplies) depending on
# how whisper.cpp is compiled: the app's armv8.2-a with dot products and half floats (since 1.14.1),
# armv8.6-a with int8 matrix multiplies (i8mm) too; 4 threads as the app. Each build reads the
# reference clip five times (best and median). The phone's own times come from the diagnostics.
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/armspeed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speed:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: CPU
        run: grep -m1 -i "features" /proc/cpuinfo; nproc
      - name: Build three ways, time each
        run: |
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp
          curl -sSfL -o model.bin https://github.com/kream0/hfd/releases/download/speech-model/ggml-tiny-ar-quran-q8_0.bin
          # The app's reference clip (al-Ikhlās 112:1), 2.9 s: the reading's cost hardly depends on the audio (30 s window).
          cp app/src/main/assets/diag/112001.wav clip.wav
          for arch in armv8.2-a+dotprod+fp16 armv8.6-a+dotprod+fp16+i8mm armv8.2-a+dotprod+fp16+i8mm; do
            dir="build-$(echo $arch | tr '+.' '__')"
            cmake -S whisper.cpp -B $dir -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CPU_ARM_ARCH=$arch >/dev/null
            cmake --build $dir -j"$(nproc)" --config Release --target whisper-cli >/dev/null
            for t in 4; do
              $dir/bin/whisper-cli -m model.bin -l ar -nt -bs 1 -bo 1 -t $t -f clip.wav >/dev/null 2>&1
              for i in 1 2 3 4 5; do
                $dir/bin/whisper-cli -m model.bin -l ar -nt -bs 1 -bo 1 -t $t -f clip.wav 2>&1 >/dev/null | grep -E "encode time|decode time|batchd time|total time" | tr -s ' ' | tr '\n' ' '
                echo
              done > times.txt
              echo "== $arch threads=$t"
              cat times.txt
              python3 -c "import re,statistics;r=[float(re.search(r'encode time = ([0-9.]+)',l).group(1)) for l in open('times.txt') if 'encode' in l];t=[float(re.search(r'total time = ([0-9.]+)',l).group(1)) for l in open('times.txt') if 'total' in l];print('   encode best %.0f median %.0f ms; total best %.0f median %.0f ms'%(min(r),statistics.median(r),min(t),statistics.median(t)))"
            done
          done
