name: Site

# Publishes docs/ (the website: tools/site/build.py writes it) to GitHub Pages,
# https://kream0.github.io/hfd/. Pages' source must be "GitHub Actions" (Settings → Pages).
on:
  push:
    branches: [claude/hfd-quran-learning-app-n48y3d]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: docs }
      - id: deployment
        uses: actions/deploy-pages@v4
