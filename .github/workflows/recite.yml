name: Recite bench

# The Recite pipeline (:core Segmenter, Level, Follower/Tracker, and the app's decoding with the
# app's model) on real recitations brought down to the owner's phone microphone level
# (tools/recite/prepare.py), and the owner's own sessions (opt-in recordings, tools/recite/owner.py).
# Prints how many words end right and how soon they show; read it with get_job_logs. Touch
# tools/recite/owner.trigger to replay new owner sessions.
on:
  push:
    branches: ['**']
    paths:
      - 'core/src/main/kotlin/app/hfd/core/recite/**'
      - 'core/src/test/kotlin/app/hfd/core/recite/ReciteBench.kt'
      - 'tools/recite/**'
      - 'app/src/main/cpp/bias.h'
      - '.github/workflows/recite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    # The app's settings on every case; other settings of the steered decoding on the owner's
    # sessions and the hard cases, side by side (tools/recite/decoder.c reads them).
    name: bench (${{ matrix.config.name }}, part ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # Each config's cases in four parts at once: with the NPU's reading times (1.15.2) the
        # phone reads several times as often, and one job went past its time limit. The summary
        # job adds the parts up.
        shard: ['0/4', '1/4', '2/4', '3/4']
        config:
          - { name: 'app: tiny, greedy, bonus 6, mistakes checked at 3 nats', key: app, model: model.bin, factor: '1', bonus: '6', beam: '0', partial: '15', check: '3', hold: '1', back: '1', previous: '1', ties: '1', only: '' }
          # The āya before not steered to (1.15.5's continuations), the rest as the app: the same run, so the same machines' noise.
          - { name: 'the āya before not steered to', key: noprev, model: model.bin, factor: '1', bonus: '6', beam: '0', partial: '15', check: '3', hold: '1', back: '1', previous: '0', ties: '1', only: '' }
          # 1.15.5: neither, nor a going back kept, nor an āya's start preferred on a tie.
          - { name: '1.15.5', key: v1155, model: model.bin, factor: '1', bonus: '6', beam: '0', partial: '15', check: '3', hold: '1', back: '0', previous: '0', ties: '0', only: '' }
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: ffmpeg, numpy, whisper.cpp, the app's model and decoding
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet numpy
          mkdir -p work && cd work
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON >/dev/null
          cmake --build whisper.cpp/build -j"$(nproc)" --config Release --target whisper >/dev/null
          curl -sSfL -o model.bin https://github.com/kream0/hfd/releases/download/speech-model/ggml-tiny-ar-quran-q8_0.bin
          echo "ef01ab441b004f9e6f1ea98d397b43452b3a45efab7c3928ab37af655dde8b52  model.bin" | sha256sum -c
          gcc -O2 -o decoder ../tools/recite/decoder.c -I../app/src/main/cpp -Iwhisper.cpp/include -Iwhisper.cpp/ggml/include \
            whisper.cpp/build/src/libwhisper.so -Wl,-rpath,$PWD/whisper.cpp/build/src:$PWD/whisper.cpp/build/ggml/src -lm
      - name: The owner's Recite sessions (kept by diag.yml)
        uses: actions/cache/restore@v5
        with:
          path: owner-rec
          key: owner-rec-none
          restore-keys: owner-rec-
      - name: Recordings (EveryAyah at the phone's level, and the owner's sessions)
        run: |
          python3 tools/recite/prepare.py work/bench
          python3 tools/recite/owner.py owner-rec work/bench
      - name: Bench
        env:
          HFD_BENCH: ${{ github.workspace }}/work/bench
          HFD_DECODER: ${{ github.workspace }}/work/decoder
          HFD_MODEL: ${{ github.workspace }}/work/${{ matrix.config.model }}
          HFD_PHONE_FACTOR: ${{ matrix.config.factor }}
          HFD_PARTIAL_FRAMES: ${{ matrix.config.partial }}
          HFD_CHECK_TOLERANCE: ${{ matrix.config.check }}
          HFD_HOLD_EDGE: ${{ matrix.config.hold }}
          HFD_KEEP_BACK: ${{ matrix.config.back }}
          HFD_STEER_PREVIOUS: ${{ matrix.config.previous }}
          HFD_AYA_START_TIES: ${{ matrix.config.ties }}
          HFD_BIAS_BONUS: ${{ matrix.config.bonus }}
          HFD_BEAM: ${{ matrix.config.beam }}
          HFD_BENCH_ONLY: ${{ matrix.config.only }}
          HFD_BENCH_SHARD: ${{ matrix.shard }}
        run: ./gradlew --no-daemon -q :core:test --tests app.hfd.core.recite.ReciteBench
      - name: Report
        if: always()
        run: cat work/bench/report.txt || true
      - name: Name the part
        if: always()
        run: echo "PART=$(echo '${{ matrix.shard }}' | tr / -)" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.config.key }}-${{ env.PART }}
          path: |
            work/bench/report.txt
            work/bench/totals.tsv
          if-no-files-found: ignore
  summary:
    # The parts added up, per config: totals, lags, and the owner's sessions.
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Report
        run: python3 tools/recite/summary.py parts
