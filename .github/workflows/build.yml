name: Build APK

# Branch pushes: run the JVM tests and build a test APK (downloadable from the run's artifacts),
# unless the push sets VERSION to a version that has no release yet, which publishes that
# release. Releases can also come from publishing a GitHub release, pushing a vX.Y.Z tag, or
# running this workflow by hand. Each release gets hfd.apk + version.json attached; the app's
# updater only looks at the latest published (non-pre)release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0 (creates tag v1.2.0 and a GitHub release)'
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      name: ${{ steps.plan.outputs.name }}
      code: ${{ steps.plan.outputs.code }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          MODE=dev; TAG=""
          case "$EVENT" in
            release) TAG="$RELEASE_TAG"; MODE=upload ;;
            workflow_dispatch) TAG="v${INPUT_VERSION#v}"; MODE=create ;;
            push)
              if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                TAG="$GITHUB_REF_NAME"
                # A release made in the GitHub UI also pushes its tag; that run is handled
                # by the "release" event instead, so skip here to avoid building twice.
                if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then MODE=skip; else MODE=create; fi
              else
                # Branch push: release if VERSION names a version that isn't released yet.
                # (gh prints the 404 body on stdout, so only trust the output when it succeeds.)
                if V=$(gh api -H "Accept: application/vnd.github.raw" \
                  "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$GITHUB_SHA" 2>/dev/null); then
                  V=$(printf '%s' "$V" | tr -d '[:space:]')
                else
                  V=""
                fi
                if [ -n "$V" ] && ! gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                  TAG="v$V"; MODE=create
                fi
              fi ;;
          esac
          NAME=""; CODE=""
          if [ -n "$TAG" ] && [ "$MODE" != skip ]; then
            V="${TAG#v}"
            if ! [[ "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Release tags must look like v1.2.3 (got '$TAG')"; exit 1
            fi
            NAME="$V"
            CODE=$(( 10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]} ))
          fi
          echo "mode=$MODE tag=$TAG name=$NAME code=$CODE"
          { echo "mode=$MODE"; echo "tag=$TAG"; echo "name=$NAME"; echo "code=$CODE"; } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    # A newer push cancels a test build still running, but never a release build.
    concurrency:
      group: build-${{ github.event.release.tag_name || github.ref }}-${{ needs.plan.outputs.mode }}
      cancel-in-progress: ${{ needs.plan.outputs.mode == 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      TAG: ${{ needs.plan.outputs.tag }}
      HFD_VERSION_NAME: ${{ needs.plan.outputs.name }}
      HFD_VERSION_CODE: ${{ needs.plan.outputs.code }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode private signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HFD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the private key from repository secrets"
          else
            echo "No KEYSTORE_BASE64 secret: signing with the public dev key (keystore/hfd-dev.jks)"
          fi

      - name: Unit tests + release APK
        env:
          HFD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HFD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HFD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :core:test :app:testReleaseUnitTest :app:assembleRelease 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo "==== ERRORS ===="
          grep -E "^e: |error:|What went wrong|Could not (find|resolve)|FAILED|AssertionError|Exception:" -A 3 build.log | head -150 || true

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/hfd.apk
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: hfd-${{ needs.plan.outputs.tag || format('dev-{0}', github.run_number) }}
          path: dist/hfd.apk

      - name: Publish release
        if: env.MODE == 'create' || env.MODE == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ "$MODE" = create ]; then
            # Notes: this version's section of CHANGELOG.md ("## 1.2.0" up to the next "## ").
            NOTES=$(awk -v v="## $HFD_VERSION_NAME" '
              index($0, v) == 1 { on = 1; next }
              on && /^## / { exit }
              on { print }' CHANGELOG.md 2>/dev/null | sed -e '/./,$!d')
            [ -n "$NOTES" ] || NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body 2>/dev/null || true)
          else
            NOTES="$RELEASE_BODY"
          fi
          [ -n "$NOTES" ] || NOTES="$(git log -1 --format=%s)"

          # Read by the in-app updater: newer versionCode => offer the update.
          jq -n \
            --argjson code "$HFD_VERSION_CODE" \
            --arg name "$HFD_VERSION_NAME" \
            --arg tag "$TAG" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg notes "${NOTES:0:600}" \
            --arg sha256 "$(sha256sum dist/hfd.apk | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s dist/hfd.apk)" \
            --arg apk "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/hfd.apk" \
            '{versionCode: $code, versionName: $name, tag: $tag, commit: $commit, notes: $notes, sha256: $sha256, size: $size, apkUrl: $apk}' \
            > dist/version.json
          cat dist/version.json

          if [ "$MODE" = create ]; then
            gh release create "$TAG" dist/hfd.apk dist/version.json \
              --target "$GITHUB_SHA" --title "HFD $HFD_VERSION_NAME" --notes "$NOTES"
          else
            gh release upload "$TAG" dist/hfd.apk dist/version.json --clobber
          fi
