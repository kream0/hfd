name: Recitation timings

# Āya boundaries in whole-sūra recitations (mp3quran.net), for reciters everyayah.com doesn't
# have: tools/audio/align.py finds them with Tarteel's model (the app's), checks every āya cut and
# commits app/src/main/assets/audio/<reciter>.json. The dev sandbox can't reach the audio hosts;
# read the report with get_job_logs, and pull before your next push.
on:
  push:
    branches: ['**']
    paths:
      - 'tools/audio/**'
      - '.github/workflows/audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - name: ffmpeg, numpy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet numpy
      - name: whisper.cpp and the app's speech model
        run: |
          mkdir -p work && cd work
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF >/dev/null
          cmake --build whisper.cpp/build -j"$(nproc)" --config Release --target whisper-cli >/dev/null
          curl -sSfL -o ggml-tiny-ar-quran-q8_0.bin https://github.com/kream0/hfd/releases/download/speech-model/ggml-tiny-ar-quran-q8_0.bin
          echo "ef01ab441b004f9e6f1ea98d397b43452b3a45efab7c3928ab37af655dde8b52  ggml-tiny-ar-quran-q8_0.bin" | sha256sum -c
      - name: Align Badr at-Turkī
        # A trial on a few sūras first (writes nothing); empty = all of them.
        env:
          SURAS: '1 2 36 67 103 108 112 113 114'
        run: python3 tools/audio/align.py badr-alturki $SURAS
      - name: Commit timings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/audio
          if git diff --cached --quiet; then echo "Timings unchanged"; exit 0; fi
          git commit -m "Āya timings for whole-sūra recitations (tools/audio/align.py)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
